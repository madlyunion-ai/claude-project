# 잿빛 심연 안드로이드 APK 빌드 (android-build 브랜치에 올리면 자동 실행)
name: Build Android APK
on:
  push:
    branches: [android-build]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ashen-abyss.apk
      - uses: actions/upload-artifact@v4
        with: { name: ashen-abyss-apk, path: ashen-abyss.apk }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest ashen-abyss.apk --target android-build --title "잿빛 심연 안드로이드 APK" --notes "자동 빌드 (${GITHUB_SHA::7}). 휴대폰에서 APK를 받아 설치하세요."
